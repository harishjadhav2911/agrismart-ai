<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriSmart AI - Offline</title>
  <meta name="theme-color" content="#16a34a">
  <link rel="icon" href="/icons/icon-192x192.png">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.8);
      --card-border: rgba(34, 197, 94, 0.2);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #16a34a;
      --primary-hover: #15803d;
      --accent: #22c55e;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f0fdf4;
        --card-bg: #ffffff;
        --card-border: rgba(34, 197, 94, 0.25);
        --text: #111827;
        --text-muted: #4b5563;
        --primary: #16a34a;
        --primary-hover: #15803d;
        --accent: #16a34a;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      backdrop-filter: blur(12px);
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(22, 163, 74, 0.2), rgba(34, 197, 94, 0.1));
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-wrapper svg {
      width: 42px;
      height: 42px;
      color: var(--accent);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text);
    }
    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 16px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .features {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed var(--card-border);
      text-align: left;
    }
    .feature-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 600;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .feature-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <p>AgriSmart AI is in offline mode. Previously loaded pages and cached crop records remain accessible without internet.</p>
    
    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
        <path d="M16 21h5v-5"/>
      </svg>
      Retry Connection
    </button>

    <div class="features">
      <div class="feature-title">Available Offline</div>
      <div class="feature-item">
        <span class="feature-dot"></span>
        <span>Cached Mandi prices & advisory logs</span>
      </div>
      <div class="feature-item">
        <span class="feature-dot"></span>
        <span>Downloaded farming guidelines & calendar</span>
      </div>
      <div class="feature-item">
        <span class="feature-dot"></span>
        <span>Saved farm bookmarks & tools</span>
      </div>
    </div>
  </div>
</body>
</html>
